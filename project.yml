# The Xcode project is generated from this file: after adding, moving or
# renaming files or targets, run `xcodegen generate`. Never edit
# MacDash.xcodeproj by hand. Layout: docs/ARCHITECTURE.md.
name: MacDash
options:
  bundleIdPrefix: com.macdash
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  defaultConfig: Release

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: "NO"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: "Automatic"
    CODE_SIGN_ENTITLEMENTS: "MacDash/Resources/MacDash.entitlements"
    INFOPLIST_FILE: "MacDash/Resources/Info.plist"
    PRODUCT_BUNDLE_IDENTIFIER: "com.macdash.app"
    MARKETING_VERSION: "1.6.0"
    CURRENT_PROJECT_VERSION: "13"
    GENERATE_INFOPLIST_FILE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    COMBINE_HIDPI_IMAGES: "YES"

targets:
  MacDash:
    type: application
    platform: macOS
    sources:
      - MacDash
    dependencies:
      - package: Sparkle
      # "Analyze with MacDash" in Finder's right-click menu, embedded in PlugIns.
      - target: MacDashFinder
    settings:
      base:
        PRODUCT_NAME: MacDash
        PRODUCT_MODULE_NAME: MacDash
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # Apple Intelligence (Assistant chat) exists on macOS 26+ only; weak so
        # MacDash still launches on macOS 13-15.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"

  MacDashFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: MacDashFinder
        excludes:
          - Info.plist
          - MacDashFinder.entitlements
    settings:
      base:
        PRODUCT_NAME: MacDashFinder
        PRODUCT_MODULE_NAME: MacDashFinder
        PRODUCT_BUNDLE_IDENTIFIER: com.macdash.app.FinderSync
        INFOPLIST_FILE: MacDashFinder/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacDashFinder/MacDashFinder.entitlements
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

  MacDashTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MacDashTests
    dependencies:
      - target: MacDash
    settings:
      base:
        PRODUCT_NAME: MacDashTests
        PRODUCT_MODULE_NAME: MacDashTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacDash.app/Contents/MacOS/MacDash"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"

schemes:
  MacDash:
    build:
      targets:
        MacDash: all
        MacDashTests: [test]
    test:
      targets:
        - name: MacDashTests
